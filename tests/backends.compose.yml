name: orleans-searchable-storage-backends

services:
  postgresql:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.2.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.36.0
    command:
      - azurite
      - --silent
      # Remove this after the pinned Azurite version accepts API 2026-02-06 natively.
      - --skipApiVersionCheck
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --location
      - /data
    ports:
      - "127.0.0.1:10000:10000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:10000/devstoreaccount1?comp=list',
          response => process.exit(response.statusCode < 500 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 2s
      timeout: 3s
      retries: 30
