name: skypulse-qualification-backends

services:
  postgresql:
    # Digest-pinned to the deployment target major/minor (deploy/hetzner-cx53
    # requires PostgreSQL 17.11 bookworm). Update the tag and digest together.
    image: postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
    environment:
      POSTGRES_DB: skypulse_qualification
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skypulse_qualification"]
      interval: 2s
      timeout: 3s
      retries: 30
