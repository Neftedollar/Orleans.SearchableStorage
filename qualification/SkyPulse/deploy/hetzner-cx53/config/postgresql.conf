# Initial CX53 calibration values. Measure and review before increasing corpus size.
listen_addresses = '*'
port = 5432
max_connections = 100
password_encryption = 'scram-sha-256'

ssl = on
ssl_cert_file = '/run/tls/server.crt'
ssl_key_file = '/run/tls/server.key'
ssl_ca_file = '/run/tls/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'

shared_buffers = '8GB'
effective_cache_size = '24GB'
maintenance_work_mem = '1GB'
work_mem = '16MB'
huge_pages = try
effective_io_concurrency = 200
random_page_cost = 1.1

wal_level = replica
wal_compression = on
checkpoint_completion_target = 0.9
min_wal_size = '2GB'
max_wal_size = '16GB'
archive_mode = off

log_destination = 'stderr'
logging_collector = off
log_statement = 'none'
log_min_duration_statement = -1
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '

timezone = 'UTC'
track_io_timing = on
