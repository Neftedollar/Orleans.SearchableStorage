name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Orleans.SearchableStorage.slnx

      - name: Build
        run: dotnet build Orleans.SearchableStorage.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Orleans.SearchableStorage.slnx --configuration Release --no-build --no-restore --collect "XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack src/Orleans.SearchableStorage/Orleans.SearchableStorage.csproj --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

  backend-contract:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_BACKEND_TEST_COUNT: "135"
      ORLEANS_SEARCHABLE_STORAGE_RUN_BACKEND_TESTS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore backend tests
        run: dotnet restore tests/Orleans.SearchableStorage.Tests/Orleans.SearchableStorage.Tests.csproj

      - name: Build backend tests
        run: dotnet build tests/Orleans.SearchableStorage.Tests/Orleans.SearchableStorage.Tests.csproj --configuration Release --no-restore

      - name: Start physical backends
        run: docker compose --file tests/backends.compose.yml up --detach --wait

      - name: Run backend storage contract
        run: >-
          dotnet test tests/Orleans.SearchableStorage.Tests/Orleans.SearchableStorage.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "Category=BackendIntegration"
          --collect "XPlat Code Coverage"
          --logger "trx;LogFileName=backend-test-results.trx"
          --results-directory artifacts/backend-test-results

      - name: Validate backend test results
        shell: bash
        run: |
          result="artifacts/backend-test-results/backend-test-results.trx"
          if [[ ! -f "$result" ]]; then
            echo "The backend test result was not produced." >&2
            exit 1
          fi

          if grep --quiet 'outcome="NotExecuted"' "$result"; then
            echo "The enabled backend contract contained skipped tests." >&2
            exit 1
          fi

          expected="<Counters total=\"${EXPECTED_BACKEND_TEST_COUNT}\" executed=\"${EXPECTED_BACKEND_TEST_COUNT}\" passed=\"${EXPECTED_BACKEND_TEST_COUNT}\" failed=\"0\""
          if ! grep --fixed-strings --quiet "$expected" "$result"; then
            echo "Expected ${EXPECTED_BACKEND_TEST_COUNT} executed and passing backend tests." >&2
            grep '<Counters ' "$result" >&2 || true
            exit 1
          fi

      - name: Stop physical backends
        if: always()
        run: docker compose --file tests/backends.compose.yml down --volumes

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: artifacts/backend-test-results
          if-no-files-found: ignore
